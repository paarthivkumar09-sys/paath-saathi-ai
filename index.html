<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>PaathSaathi AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      max-width: 420px;
      width: 90%;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      font-size: 42px;
    }

    h1 {
      margin: 10px 0;
      color: #1565c0;
    }

    p {
      color: #444;
      font-size: 16px;
      line-height: 1.5;
    }

    .tags {
      margin-top: 15px;
      font-size: 14px;
      color: #2e7d32;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">📘</div>

    <h1>PaathSaathi AI</h1>

    <p>
      Class 1–10 ke students ke liye<br>
      <b>NCERT-based Friendly AI Teacher</b>
    </p>

    <div class="tags">
      Hindi • Odia • English • Hinglish 😊
    </div>

    <div class="note">
      Poochho • Samjho • Seekho <br>
      Bina dar, bina pressure 🙂
    </div>
  </div>

  <!-- Botpress Webchat -->
  <script src="https://cdn.botpress.cloud/webchat/v3.5/inject.js" defer></script>
  <script src="https://files.bpcontent.cloud/2026/02/06/20260206081444-HQX5UE81.js" defer></script>

</body>
</html>
