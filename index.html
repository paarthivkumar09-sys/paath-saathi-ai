<!DOCTYPE html>
<html lang="hi">
<head>

  <style>

      margin-bottom: 10px;
    }

    h1 {
      margin: 8px 0;
      color: #1565c0;
    }

    p {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
      margin: 10px 0;
    }

    .tags {
      margin-top: 14px;
      font-size: 14px;
      color: #2e7d32;
      font-weight: 600;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
    }

    /* ✅ BOT CHAT ALWAYS ON TOP */
    .bp-webchat-container {
      z-index: 9999 !important;
    }

</head>
